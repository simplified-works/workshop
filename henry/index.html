<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IdeenBlitz">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>IdeenBlitz – Nie mehr Langeweile</title>
<style>
  :root {
    --hintergrund: #f2f2f7;
    --karte: #ffffff;
    --text: #1c1c2e;
    --text-leise: #8e8e93;
    --akzent1: #7c3aed;
    --akzent2: #f43f5e;
    --chip: #eeeaf9;
    --daumen-bg: #f2f2f7;
    --schatten: 0 8px 24px rgba(28, 28, 46, 0.10), 0 2px 6px rgba(28, 28, 46, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --hintergrund: #000000;
      --karte: #1c1c1e;
      --text: #f2f2f7;
      --text-leise: #98989e;
      --chip: #2c2440;
      --daumen-bg: #2c2c2e;
      --schatten: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: var(--hintergrund);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 18px);
    text-align: center;
  }

  /* ── Kopfzeile mit Logo ───────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 560px;
  }

  .logo {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(124, 58, 237, 0.35);
  }

  .app-name {
    text-align: left;
  }

  .app-name b {
    display: block;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.4px;
  }

  .app-name span {
    font-size: 13px;
    color: var(--text-leise);
    font-weight: 500;
  }

  /* ── Bühne (Mitte) ────────────────────────── */
  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .karte {
    background: var(--karte);
    border-radius: 26px;
    box-shadow: var(--schatten);
    padding: clamp(24px, 5vh, 40px) 26px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .karte.neu {
    animation: reinschweben 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes reinschweben {
    from { transform: translateY(24px) scale(0.94); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .abzeichen {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--akzent1);
    background: var(--chip);
    padding: 6px 14px;
    border-radius: 999px;
  }

  .emoji-kreis {
    width: clamp(88px, 20vh, 128px);
    height: clamp(88px, 20vh, 128px);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(124,58,237,0.16), rgba(244,63,94,0.12));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(48px, 11vh, 72px);
    line-height: 1;
  }

  .ideen-text {
    font-size: clamp(19px, 4.6vw, 27px);
    font-weight: 700;
    letter-spacing: -0.3px;
    line-height: 1.35;
    min-height: 2.7em;
    display: flex;
    align-items: center;
  }

  /* ── Bewertung ────────────────────────────── */
  .bewertung {
    display: flex;
    gap: 16px;
  }

  .bewertung button {
    font-size: 26px;
    background: var(--daumen-bg);
    border: none;
    border-radius: 50%;
    width: 58px;
    height: 58px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
  }

  .bewertung button:active { transform: scale(1.2); }
  .bewertung button.gut     { background: #30d158; box-shadow: 0 4px 12px rgba(48,209,88,0.4); }
  .bewertung button.schlecht{ background: #ff453a; box-shadow: 0 4px 12px rgba(255,69,58,0.4); }

  .danke {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-leise);
    min-height: 18px;
  }

  /* ── Grosser Knopf unten ──────────────────── */
  footer {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .idee-knopf {
    width: 100%;
    border: none;
    border-radius: 20px;
    padding: 19px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: #fff;
    background: linear-gradient(135deg, var(--akzent1), var(--akzent2));
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
  }

  .idee-knopf:active {
    transform: scale(0.97);
    filter: brightness(1.1);
    box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
  }

  .zaehler {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-leise);
  }
</style>
</head>
<body>

  <header>
    <!-- Das Logo: ein Blitz, weil die Ideen blitzschnell kommen -->
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="logoVerlauf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7c3aed"/>
          <stop offset="1" stop-color="#f43f5e"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="24" fill="url(#logoVerlauf)"/>
      <path d="M60 12 L24 56 L45 56 L40 88 L76 44 L55 44 Z" fill="#fff"/>
    </svg>
    <div class="app-name">
      <b>IdeenBlitz</b>
      <span>Nie mehr Langeweile</span>
    </div>
  </header>

  <main>
    <div class="karte" id="karte">
      <div class="abzeichen" id="abzeichen">Deine Idee</div>
      <div class="emoji-kreis" id="emoji">⚡️</div>
      <div class="ideen-text" id="ideenText">Bereit? Hol dir deinen ersten Ideen&#8203;blitz!</div>
      <div class="bewertung" id="bewertung" style="visibility:hidden">
        <button id="daumenHoch" onclick="bewerten(1)" aria-label="Gute Idee">👍</button>
        <button id="daumenRunter" onclick="bewerten(-1)" aria-label="Schlechte Idee">👎</button>
      </div>
      <div class="danke" id="danke"></div>
    </div>
  </main>

  <footer>
    <button class="idee-knopf" onclick="neueIdee()">⚡️ Ideenblitz!</button>
    <div class="zaehler" id="zaehler">Drück den Knopf, wenn dir langweilig ist</div>
  </footer>

<script>
  // ─────────────────────────────────────────────
  // Hier stehen alle Ideen. Du kannst selber welche dazuschreiben!
  // ─────────────────────────────────────────────
  const IDEEN = [
    { emoji: "🏰", text: "Bau eine Höhle aus Decken und Kissen!" },
    { emoji: "🎨", text: "Mal ein Bild von deinem Lieblingstier!" },
    { emoji: "📚", text: "Lies ein Buch an einem geheimen Ort!" },
    { emoji: "🧩", text: "Mach ein Puzzle – auf Zeit!" },
    { emoji: "🕵️", text: "Spiel Detektiv: Versteck etwas und schreib eine Schatzkarte!" },
    { emoji: "🍪", text: "Frag, ob ihr zusammen Guetzli backen könnt!" },
    { emoji: "🎭", text: "Erfinde ein Theaterstück und führ es der Familie vor!" },
    { emoji: "🚲", text: "Mach eine Velotour um den Block!" },
    { emoji: "🎵", text: "Erfinde einen eigenen Song und nimm ihn auf!" },
    { emoji: "🏗️", text: "Bau den höchsten Turm, den du kannst – aus Lego oder Bauklötzen!" },
    { emoji: "🔬", text: "Mach ein Experiment: Was schwimmt, was sinkt? Teste es mit Sachen aus der Küche!" },
    { emoji: "🎪", text: "Übe einen Zaubertrick und zeig ihn jemandem!" },
    { emoji: "🐜", text: "Geh raus und beobachte Insekten – wie viele verschiedene findest du?" },
    { emoji: "✉️", text: "Schreib einen Brief an deine Grosseltern oder einen Freund!" },
    { emoji: "🏃", text: "Bau einen Hindernis-Parcours und stopp deine Zeit!" },
    { emoji: "📸", text: "Mach eine Foto-Safari: Fotografiere 10 rote Dinge!" },
    { emoji: "🃏", text: "Bau ein Kartenhaus – wie hoch schaffst du es?" },
    { emoji: "🌱", text: "Pflanz etwas ein und schau ihm beim Wachsen zu!" },
    { emoji: "🎲", text: "Erfinde dein eigenes Brettspiel mit eigenen Regeln!" },
    { emoji: "📖", text: "Schreib eine Geschichte über einen Superhelden – du bist der Held!" },
    { emoji: "🧦", text: "Sockentheater! Mach aus alten Socken Handpuppen!" },
    { emoji: "🎯", text: "Bau eine Wurfbude mit Bechern und einem Ball!" },
    { emoji: "🗺️", text: "Zeichne eine Karte von deinem Zimmer oder deiner Wohnung!" },
    { emoji: "💃", text: "Mach eine Tanzparty – dreh die Musik auf!" },
    { emoji: "🔭", text: "Schau am Abend die Sterne an – findest du den grossen Wagen?" },
    { emoji: "🏴‍☠️", text: "Spiel Pirat: Dein Bett ist das Schiff, der Boden ist das Meer!" },
    { emoji: "🧊", text: "Frier kleine Spielsachen in Eiswürfel ein und befreie sie!" },
    { emoji: "📞", text: "Ruf jemanden an, den du gern hast!" },
    { emoji: "🎬", text: "Dreh einen kurzen Film mit deinen Spielsachen!" },
    { emoji: "🍋", text: "Mach selber Zitronen-Limonade!" },
    { emoji: "🪁", text: "Bastle etwas aus Papier: Flieger, Schiff oder Hut!" },
    { emoji: "🤸", text: "Lern einen neuen Trick: Handstand, Rad oder Jonglieren!" },
    { emoji: "🔍", text: "Mach eine Schnitzeljagd für jemanden aus deiner Familie!" },
    { emoji: "🎹", text: "Erfinde ein Instrument aus Sachen, die du findest!" },
    { emoji: "🐾", text: "Denk dir ein Fantasie-Tier aus und zeichne es!" },
    { emoji: "🏠", text: "Bau ein Haus für deine Kuscheltiere!" },
    { emoji: "⏰", text: "Räum dein Zimmer auf – aber auf Zeit, wie ein Wettkampf!" },
    { emoji: "🌈", text: "Sammle draussen Sachen in allen Regenbogenfarben!" },
    { emoji: "🥷", text: "Schleich-Training: Beweg dich durchs Haus, ohne dass dich jemand hört!" },
    { emoji: "🧠", text: "Lern 5 neue Wörter in einer anderen Sprache!" }
  ];

  // ─────────────────────────────────────────────
  // Die Witze für die Witz-Pause
  // ─────────────────────────────────────────────
  const WITZE = [
    { emoji: "🐄", text: "Was macht eine Kuh, wenn ihr langweilig ist? – Muuuhsik hören!" },
    { emoji: "🚜", text: "Was ist gelb und kann nicht schwimmen? – Ein Bagger. Und warum? – Weil er nur einen Arm hat!" },
    { emoji: "🐧", text: "Was sagt ein Pinguin in der Wüste? – «Ich glaub, ich bin falsch abgebogen!»" },
    { emoji: "🍞", text: "Treffen sich zwei Brote. Sagt das eine: «Du siehst heute aber alt aus!» – «Ja, ich bin von gestern.»" },
    { emoji: "👻", text: "Warum können Geister so schlecht lügen? – Weil man durch sie hindurchsieht!" },
    { emoji: "🐘", text: "Warum haben Elefanten rote Augen? – Damit sie sich besser im Kirschbaum verstecken können!" },
    { emoji: "🧛", text: "Was trinkt ein Vampir am liebsten? – Tomatensaft mit ganz viel O!" },
    { emoji: "🐌", text: "Sagt eine Schnecke zur anderen: «Wow, du bist aber schnell heute!» – «Ja, ich hab Turnschuhe an!»" },
    { emoji: "🦒", text: "Warum hat die Giraffe so einen langen Hals? – Weil ihr Kopf so weit oben ist!" },
    { emoji: "🍕", text: "Was sagt eine Pizza, die zu spät kommt? – «Sorry, ich war noch im Ofen!»" },
    { emoji: "🐟", text: "Was macht ein Fisch am Computer? – Er surft im Netz!" },
    { emoji: "🤖", text: "Warum ging der Roboter zum Arzt? – Er hatte einen Virus!" },
    { emoji: "🐝", text: "Was sagt eine Biene zur Blume? – «Hallo Süsse!»" },
    { emoji: "⚽", text: "Warum können Skelette so schlecht Fussball spielen? – Weil ihnen der Mumm fehlt!" }
  ];

  // ─────────────────────────────────────────────
  // Hier merkt sich die App deine Bewertungen (👍 = +1, 👎 = -1).
  // Das bleibt gespeichert, auch wenn du die App schliesst!
  // ─────────────────────────────────────────────
  let punkte = JSON.parse(localStorage.getItem("ideenPunkte") || "{}");
  let klickZahl = 0;
  let aktuelleIdee = null;
  let letzteIdeen = []; // damit nicht 2x hintereinander das Gleiche kommt

  function speichern() {
    localStorage.setItem("ideenPunkte", JSON.stringify(punkte));
  }

  // Ideen mit vielen 👍 kommen öfter, Ideen mit vielen 👎 fast nie.
  function gewichtVon(idee) {
    const p = punkte[idee.text] || 0;
    if (p <= -2) return 0.05;   // fast nie
    if (p < 0)   return 0.3;    // selten
    return 1 + p * 0.5;          // je mehr 👍, desto öfter
  }

  function zufaelligeIdee() {
    const auswahl = IDEEN.filter(i => !letzteIdeen.includes(i.text));
    let summe = 0;
    for (const i of auswahl) summe += gewichtVon(i);
    let los = Math.random() * summe;
    for (const i of auswahl) {
      los -= gewichtVon(i);
      if (los <= 0) return i;
    }
    return auswahl[auswahl.length - 1];
  }

  function neueIdee() {
    klickZahl++;

    const karte = document.getElementById("karte");
    karte.classList.remove("neu");
    void karte.offsetWidth; // Trick, damit die Animation neu startet
    karte.classList.add("neu");

    document.getElementById("danke").textContent = "";
    document.getElementById("daumenHoch").className = "";
    document.getElementById("daumenRunter").className = "";

    const abzeichen = document.getElementById("abzeichen");

    // Jedes 4. Mal gibt es einen Witz statt einer Idee!
    if (klickZahl % 4 === 0) {
      const witz = WITZE[Math.floor(Math.random() * WITZE.length)];
      abzeichen.textContent = "😂 Witz-Pause";
      document.getElementById("emoji").textContent = witz.emoji;
      document.getElementById("ideenText").textContent = witz.text;
      document.getElementById("bewertung").style.visibility = "hidden";
      aktuelleIdee = null;
    } else {
      aktuelleIdee = zufaelligeIdee();
      letzteIdeen.push(aktuelleIdee.text);
      if (letzteIdeen.length > 5) letzteIdeen.shift();

      abzeichen.textContent = "⚡️ Deine Idee";
      document.getElementById("emoji").textContent = aktuelleIdee.emoji;
      document.getElementById("ideenText").textContent = aktuelleIdee.text;
      document.getElementById("bewertung").style.visibility = "visible";
    }

    document.getElementById("zaehler").textContent =
      klickZahl + (klickZahl === 1 ? " Ideenblitz geholt" : " Ideenblitze geholt");
  }

  function bewerten(wert) {
    if (!aktuelleIdee) return;
    punkte[aktuelleIdee.text] = (punkte[aktuelleIdee.text] || 0) + wert;
    speichern();

    if (wert === 1) {
      document.getElementById("daumenHoch").className = "gut";
      document.getElementById("danke").textContent = "Super! Die Idee kommt jetzt öfter. 🎉";
    } else {
      document.getElementById("daumenRunter").className = "schlecht";
      document.getElementById("danke").textContent = "Okay, die zeig ich dir fast nicht mehr.";
    }
  }
</script>
</body>
</html>
